<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>あおい株分析</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box} body{margin:0}.wrap{max-width:720px;margin:auto;padding:18px}
    header{padding:10px 0 18px} h1{margin:0;font-size:27px}.sub{color:#6b7280;margin-top:5px}
    .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0000000d;margin-bottom:14px}
    label{font-weight:700;display:block;margin:10px 0 6px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:13px;font-size:16px}
    textarea{min-height:72px}.pick{display:block;border:2px dashed #c7cad1;border-radius:16px;padding:24px;text-align:center;cursor:pointer}
    #file{display:none}#preview{width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin-top:12px;display:none}
    .row{display:flex;align-items:center;gap:10px;margin:14px 0}.row input{width:auto}
    button{width:100%;border:0;border-radius:14px;padding:15px;background:#111827;color:#fff;font-size:17px;font-weight:800}
    button:disabled{opacity:.5}.result{white-space:pre-wrap;line-height:1.72;font-size:15.5px}.status{text-align:center;color:#6b7280;padding:8px}
    .tiny{font-size:12px;color:#6b7280;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
<header><h1>あおい株分析 📈</h1><div class="sub">チャートを送って、いつもの分析。</div></header>
<div class="card">
  <label>銘柄名・コード</label>
  <input id="symbol" placeholder="例：5016 JX金属">
  <label>追加メモ（任意）</label>
  <textarea id="note" placeholder="例：2〜5日目線。今日の上ヒゲを重視して。"></textarea>
  <label>チャート画像</label>
  <label class="pick" for="file">📷 写真を撮る / 画像を選ぶ</label>
  <input id="file" type="file" accept="image/*">
  <img id="preview" alt="チャートプレビュー">
  <div class="row"><input id="web" type="checkbox" checked><label for="web" style="margin:0">🌐 最新情報もWeb検索する</label></div>
  <button id="go">あおい分析する</button>
  <div class="tiny">画像の数値が不鮮明な場合は断定せず、条件付きで分析します。</div>
</div>
<div id="status" class="status"></div>
<div id="outCard" class="card" style="display:none"><div id="out" class="result"></div></div>
</div>
<script>
let imageDataUrl = "";
const file = document.getElementById("file"), preview = document.getElementById("preview");
file.addEventListener("change", () => {
  const f = file.files?.[0]; if(!f) return;
  if(f.size > 12*1024*1024){ alert("画像が大きすぎます。12MB以下にしてください。"); file.value=""; return; }
  const r = new FileReader();
  r.onload = () => { imageDataUrl=r.result; preview.src=r.result; preview.style.display="block"; };
  r.readAsDataURL(f);
});
document.getElementById("go").onclick = async () => {
  if(!imageDataUrl){ alert("まずチャート画像を選んでね。"); return; }
  const btn=document.getElementById("go"), status=document.getElementById("status"), card=document.getElementById("outCard"), out=document.getElementById("out");
  btn.disabled=true; status.textContent="あおい分析中… 📈"; card.style.display="none";
  try{
    const resp=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      symbol:document.getElementById("symbol").value,
      note:document.getElementById("note").value,
      webSearch:document.getElementById("web").checked,
      imageDataUrl
    })});
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.error||"エラー");
    out.textContent=data.text; card.style.display="block"; status.textContent="";
  }catch(e){ status.textContent="⚠️ "+e.message; }
  finally{btn.disabled=false;}
};
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body></html>
